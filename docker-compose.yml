# Infraestructura:        docker compose up -d
# Stack completo (+ app): docker compose --profile app up -d --build
# Requiere .env (ver .env.example o infrastructure/scripts/setup.sh).

x-java-service: &java-service
  profiles: ["app"]
  restart: unless-stopped
  environment: &java-env
    MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:?definir en .env}:${MONGO_ROOT_PASSWORD:?definir en .env}@mongodb:27017/?authSource=admin
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    JWT_SECRET: ${JWT_SECRET:?definir en .env}
    # Solo en local: arranque rápido y menos hilos (10 JVM comparten la CPU de Docker Desktop)
    JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
  depends_on:
    - mongodb
    - redis
    - kafka
  networks:
    - vito-network
  deploy:
    resources:
      limits:
        memory: 512m

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: vito-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?definir en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?definir en .env}
      MONGO_INITDB_DATABASE: vito_db
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/docker/mongodb/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - vito-network

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: vito-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - vito-network

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vito-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vito-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vito-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - vito-network

  # SRS Media Server
  srs:
    image: ossrs/srs:5
    container_name: vito-srs
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8090:8080"   # HTTP de SRS (el 8080 del host es del api-gateway)
      - "8000:8000/udp" # WebRTC
    environment:
      CANDIDATE: ${SRS_CANDIDATE:-127.0.0.1}   # IP que verán los clientes WebRTC
    volumes:
      - ./infrastructure/docker/srs/srs.conf:/usr/local/srs/conf/docker.conf
    networks:
      - vito-network

  # ── Object storage (S3 compatible) ─────────────────────────────
  # MinIO ya no publica imágenes comunitarias (minio/minio pide login). SeaweedFS (Apache-2.0)
  # expone una API S3; las credenciales salen de S3_ACCESS_KEY / S3_SECRET_KEY del .env.
  object-storage:
    image: chrislusf/seaweedfs:3.97
    container_name: vito-object-storage
    ports:
      - "9000:8333"   # S3 API en http://localhost:9000 (S3_ENDPOINT por defecto)
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir en .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir en .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"vito","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - object_storage_data:/data
    networks:
      - vito-network

  # ── Servicios Spring Boot (perfil "app") ──────────────────────
  # Solo el gateway publica puerto en el host; el resto se alcanza a través de él.
  auth-service:
    <<: *java-service
    build:
      context: ./backend/auth-service
      dockerfile: ../Dockerfile
    image: vito/auth-service:local
    container_name: vito-auth-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  social-service:
    <<: *java-service
    build:
      context: ./backend/social-service
      dockerfile: ../Dockerfile
    image: vito/social-service:local
    container_name: vito-social-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  event-service:
    <<: *java-service
    build:
      context: ./backend/event-service
      dockerfile: ../Dockerfile
    image: vito/event-service:local
    container_name: vito-event-service
    environment:
      <<: *java-env
      QR_SECRET: ${QR_SECRET:?definir en .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  checkin-service:
    <<: *java-service
    build:
      context: ./backend/checkin-service
      dockerfile: ../Dockerfile
    image: vito/checkin-service:local
    container_name: vito-checkin-service
    environment:
      <<: *java-env
      QR_SECRET: ${QR_SECRET:?definir en .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  mosaic-service:
    <<: *java-service
    build:
      context: ./backend/mosaic-service
      dockerfile: ../Dockerfile
    image: vito/mosaic-service:local
    container_name: vito-mosaic-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  streaming-service:
    <<: *java-service
    build:
      context: ./backend/streaming-service
      dockerfile: ../Dockerfile
    image: vito/streaming-service:local
    container_name: vito-streaming-service
    environment:
      <<: *java-env
      SRS_API_URL: http://srs:1985
      SRS_STREAM_URL: rtmp://localhost:1935
      SRS_PLAYBACK_URL: http://localhost:8090
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  archive-service:
    <<: *java-service
    build:
      context: ./backend/archive-service
      dockerfile: ../Dockerfile
    image: vito/archive-service:local
    container_name: vito-archive-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  chat-service:
    <<: *java-service
    build:
      context: ./backend/chat-service
      dockerfile: ../Dockerfile
    image: vito/chat-service:local
    container_name: vito-chat-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
  media-service:
    <<: *java-service
    build:
      context: ./backend/media-service
      dockerfile: ../Dockerfile
    image: vito/media-service:local
    container_name: vito-media-service
    environment:
      <<: *java-env
      S3_ENDPOINT: http://object-storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?definir en .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?definir en .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8089/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5
    depends_on:
      - mongodb
      - redis
      - kafka
      - object-storage
  api-gateway:
    <<: *java-service
    build:
      context: ./backend/api-gateway
      dockerfile: ../Dockerfile
    image: vito/api-gateway:local
    container_name: vito-api-gateway
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - auth-service
      - social-service
      - event-service
      - checkin-service
      - mosaic-service
      - streaming-service
      - archive-service
      - chat-service
      - media-service
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 180s   # 10 JVM arrancando a la vez en un portátil
      retries: 5

volumes:
  mongodb_data:
  redis_data:
  object_storage_data:

networks:
  vito-network:
    driver: bridge
