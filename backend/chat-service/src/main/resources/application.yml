spring:
  application:
    name: chat-service
  
  profiles:
    active: dev
  
  mongodb:
    uri: ${MONGODB_URI}
    database: vito_db
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chat-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin broker, send() bloquea hasta max.block.ms (60 s por defecto)
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}

server:
  port: 8088

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# Orígenes de la web para el handshake WebSocket (T-B20): los mismos que el CORS del gateway
websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Chat Configuration
chat:
  max-message-length: 5000
  max-room-participants: 1000
  message-retention-days: 90

# Logging
logging:
  level:
    com.vito.chat: DEBUG
    org.springframework.web.socket: DEBUG

# Actuator: health para Docker/K8s (liveness/readiness)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
