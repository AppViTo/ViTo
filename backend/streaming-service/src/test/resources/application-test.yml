spring:
  application:
    name: streaming-service-test
  
  mongodb:
    uri: mongodb://localhost:27017/vito_streaming_test
  
  redis:
    host: localhost
    port: 6379
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

srs:
  api-url: http://localhost:1985
  stream-url: rtmp://localhost:1935
  playback-url: http://localhost:8080

jwt:
  secret: test-secret-key-for-testing-only-123456789012345678901234567890

logging:
  level:
    com.vito: DEBUG
    org.springframework.security: DEBUG
