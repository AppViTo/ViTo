server:
  port: 8086

spring:
  application:
    name: streaming-service
  
  mongodb:
    uri: ${MONGODB_URI}
    database: vito_streaming
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin broker, send() bloquea hasta max.block.ms (60 s por defecto)
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}

srs:
  api-url: ${SRS_API_URL:http://localhost:1985}
  stream-url: ${SRS_STREAM_URL:rtmp://localhost:1935}
  playback-url: ${SRS_PLAYBACK_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.vito: DEBUG
    org.springframework.security: DEBUG

# Actuator: health para Docker/K8s (liveness/readiness)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Orígenes de la web para el handshake WebSocket (T-B20): los mismos que el CORS del gateway
websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
