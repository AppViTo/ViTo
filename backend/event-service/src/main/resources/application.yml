server:
  port: 8083

spring:
  application:
    name: event-service
  
  # Jackson 3 falla con null en primitivos; Jackson 2 lo tomaba como false (contrato: default false)
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  mongodb:
    uri: ${MONGODB_URI}
    database: vito_events
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin broker, send() bloquea hasta max.block.ms (60 s por defecto)
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}

jwt:
  secret: ${JWT_SECRET}

qr:
  secret: ${QR_SECRET}

logging:
  level:
    com.vito: DEBUG
    org.springframework.security: DEBUG

# Actuator: health para Docker/K8s (liveness/readiness)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
