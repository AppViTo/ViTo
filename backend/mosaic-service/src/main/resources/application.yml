server:
  port: 8085

spring:
  application:
    name: mosaic-service
  
  mongodb:
    uri: ${MONGODB_URI}
    database: vito_mosaic
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin broker, send() bloquea hasta max.block.ms (60 s por defecto)
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}

jwt:
  secret: ${JWT_SECRET}

# Dueño del evento (ADR-016): de aquí sale el organizador para removeMosaicItem (T-B26)
event-service:
  uri: ${EVENT_SERVICE_URI:http://localhost:8083}

logging:
  level:
    com.vito: DEBUG
    org.springframework.security: DEBUG

# Actuator: health para Docker/K8s (liveness/readiness)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Orígenes de la web para el handshake WebSocket (T-B20): los mismos que el CORS del gateway
websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
