server:
  port: 8082

spring:
  application:
    name: social-service
  
  data:
    mongodb:
      uri: mongodb://admin:test_password@localhost:27017/vito_social?authSource=admin
  
  redis:
    host: localhost
    port: 6379
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-validation}

logging:
  level:
    com.vito: DEBUG
    org.springframework.security: DEBUG
