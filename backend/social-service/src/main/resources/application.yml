server:
  port: 8082

spring:
  application:
    name: social-service
  
  mongodb:
    uri: ${MONGODB_URI}
    database: vito_social
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin broker, send() bloquea hasta max.block.ms (60 s por defecto)
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}

jwt:
  secret: ${JWT_SECRET}

# T004 (Ola 2a): auth-service es dueño de la identidad; social-service le pide nombre y avatar
# por lotes (getUsersByIds) en cada perfil y lista. En Compose, por su DNS interno.
auth-service:
  uri: ${AUTH_SERVICE_URI:http://localhost:8081}

logging:
  level:
    com.vito: DEBUG
    org.springframework.security: DEBUG

# Actuator: health para Docker/K8s (liveness/readiness)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
