spring:
  application:
    name: auth-service
  
  profiles:
    active: dev
  
  mongodb:
    uri: ${MONGODB_URI}
    database: vito_db
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: auth-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin broker, send() bloquea hasta max.block.ms (60 s por defecto)
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}

server:
  port: 8081

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  # 15 min (ADR-004: expiresIn 900). El cliente renueva con el refresh token ante 401/4401;
  # acota cuánto sirve un token revocado si el gateway no puede consultar Redis (T-B21).
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: 604800000  # 7 days

# Logging
logging:
  level:
    com.vito: DEBUG
    org.springframework.security: DEBUG

# Actuator: health para Docker/K8s (liveness/readiness)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
