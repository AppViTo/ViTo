spring:
  application:
    name: api-gateway
  
  profiles:
    active: dev
  
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
          globalcors:
            cors-configurations:
              '[/**]':
            # Producción: origen de la web en Cloudflare Pages (docker-compose.prod.yml)
                allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
      
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
      
      # Única definición de rutas (T-B11). Los perfiles solo cambian las *_SERVICE_URI;
      # si redefinen la lista, Spring la reemplaza entera y se pierden los filtros.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: authServiceCircuitBreaker
                    fallbackUri: forward:/fallback/auth
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: social-service
              uri: ${SOCIAL_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/social/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: socialServiceCircuitBreaker
                    fallbackUri: forward:/fallback/social
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: event-service
              uri: ${EVENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/events/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: eventServiceCircuitBreaker
                    fallbackUri: forward:/fallback/events
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
        
            # Ola 1 (R5, T019): vista previa pública de un enlace de invitación. Límite por IP
            # (no hay sesión): 6 tokens por petición y 1 de reposición por segundo = 10/min, con
            # ráfaga de 20 (burstCapacity 120). Retry-After: 6 s (RateLimitedResponseFilter).
            - id: invite-link-preview
              uri: ${EVENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/invite-links/{token}
                - Method=GET
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: eventServiceCircuitBreaker
                    fallbackUri: forward:/fallback/events
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 120
                    redis-rate-limiter.requestedTokens: 6

            # Unirse por enlace (con sesión): el límite por usuario de event-service (T-B23).
            - id: invite-links
              uri: ${EVENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/invite-links/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: eventServiceCircuitBreaker
                    fallbackUri: forward:/fallback/events
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40

            - id: checkin-service
              uri: ${CHECKIN_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/checkin/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: checkinServiceCircuitBreaker
                    fallbackUri: forward:/fallback/checkin
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: mosaic-service
              uri: ${MOSAIC_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/mosaic/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: mosaicServiceCircuitBreaker
                    fallbackUri: forward:/fallback/mosaic
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: streaming-service
              uri: ${STREAMING_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/streaming/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: streamingServiceCircuitBreaker
                    fallbackUri: forward:/fallback/streaming
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: archive-service
              uri: ${ARCHIVE_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/archive/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: archiveServiceCircuitBreaker
                    fallbackUri: forward:/fallback/archive
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: chat-service
              uri: ${CHAT_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/chat/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: chatServiceCircuitBreaker
                    fallbackUri: forward:/fallback/chat
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: media-service
              uri: ${MEDIA_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/media/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: mediaServiceCircuitBreaker
                    fallbackUri: forward:/fallback/media
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: transcode-service
              uri: ${TRANSCODE_SERVICE_URI:http://localhost:8000}
              predicates:
                - Path=/api/v1/transcode/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: transcodeServiceCircuitBreaker
                    fallbackUri: forward:/fallback/transcode
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: recommendation-service
              uri: ${RECOMMENDATION_SERVICE_URI:http://localhost:8001}
              predicates:
                - Path=/api/v1/recommendations/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: recommendationServiceCircuitBreaker
                    fallbackUri: forward:/fallback/recommendations
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
        
            - id: moderation-service
              uri: ${MODERATION_SERVICE_URI:http://localhost:8002}
              predicates:
                - Path=/api/v1/moderation/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: moderationServiceCircuitBreaker
                    fallbackUri: forward:/fallback/moderation
                - name: RequestRateLimiter
                  args:
                    deny-empty-key: false
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

        # WebSocket crudo (ADR-006). JwtAuthenticationFilter valida ?token= y cierra con 4401.
        # La URI es http: el gateway la convierte a ws:// cuando el request trae Upgrade: websocket.
            - id: checkin-ws
              uri: ${CHECKIN_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/ws/checkin/**

            - id: mosaic-ws
              uri: ${MOSAIC_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/ws/mosaic/**

            - id: streaming-ws
              uri: ${STREAMING_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/ws/streaming/**

            - id: chat-ws
              uri: ${CHAT_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/ws/chat/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# T-B21: consulta de access tokens revocados (revoked_jti:<jti> en Redis). Si Redis no
# responde en este tiempo, el gateway falla abierto: acepta el token con firma válida y
# cuenta el fallo en vito.gateway.revocation.check.errors.
vito:
  # T-B23: saltos de proxy delante del gateway cuyo X-Forwarded-For se cree para el bucket por
  # IP de las rutas públicas. 0 = la dirección de la conexión; prod (detrás de Caddy) usa 1.
  rate-limit:
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:0}
  security:
    revocation:
      redis-timeout: ${REVOCATION_REDIS_TIMEOUT:250ms}
  # T-I21 (excepción A3): solo pesa en el perfil prod (ClosedUploadRoutesFilter). Apagada, la
  # subida y las escrituras del mosaico responden 404; encendida, se abren las de la Ola 3.
  mosaic:
    uploads-enabled: ${MOSAIC_UPLOADS_ENABLED:false}

# Resilience4j Circuit Breaker
resilience4j:
  # T-B37: configuración común. Las instancias la heredan con base-config y las rutas sin
  # instancia propia (chat, media, archive, Python) la reciben como valor por defecto.
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        # Un bulkhead lleno es exceso de concurrencia en el gateway, no una falla del servicio:
        # recibe el fallback (503), pero no cuenta para abrir el breaker
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
    instances:
      authServiceCircuitBreaker:
        base-config: default
        register-health-indicator: true
        event-consumer-buffer-size: 10
      socialServiceCircuitBreaker:
        base-config: default
        register-health-indicator: true
      eventServiceCircuitBreaker:
        base-config: default
        register-health-indicator: true
      checkinServiceCircuitBreaker:
        base-config: default
        register-health-indicator: true
      mosaicServiceCircuitBreaker:
        base-config: default
        register-health-indicator: true
      streamingServiceCircuitBreaker:
        base-config: default
        register-health-indicator: true

  # T-B37: el filtro CircuitBreaker de Spring Cloud envuelve cada ruta en un bulkhead creado con
  # esta configuración por defecto (ignora resilience4j.bulkhead.instances). Sin ella, el
  # límite de Resilience4j es de 25 llamadas concurrentes por ruta: en k6 (T061), 150 RSVP
  # simultáneos recibían ~120 respuestas 503 al instante. 200 = hilos de Tomcat por defecto de
  # cada servicio: por encima de eso el servicio ya encola, así que el gateway no corta antes.
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 200
        max-wait-duration: 0s

  retry:
    instances:
      authServiceCircuitBreaker:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      eventServiceCircuitBreaker:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  # Sin esto el CircuitBreaker usa el TimeLimiter por defecto de Resilience4j (1 s): una
  # petición lenta que el servicio sí completa (p. ej. el primer registro tras arrancar)
  # recibía el fallback. Igual que spring.cloud.gateway.server.webflux.httpclient.response-timeout.
  timelimiter:
    configs:
      default:
        timeout-duration: 10s

  ratelimiter:
    instances:
      default:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0s
      auth:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0s
      events:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0s

# Actuator
# Actuator en un puerto propio que no se publica (T-B14): el 8080 es el borde público y
# no debe servir /actuator. Se quita el endpoint "gateway", que permite crear y borrar
# rutas por POST.
management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    gateway:
      enabled: false
    health:
      show-details: always
      probes:
        enabled: true

# Logging
logging:
  level:
    com.vito.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
