# Perfil de desarrollo local: servicios en localhost (valores por defecto de application.yml).
# No redefinir spring.cloud.gateway.routes aquí: reemplazaría la lista completa y se
# perderían RequestRateLimiter y CircuitBreaker (T-B11).
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
