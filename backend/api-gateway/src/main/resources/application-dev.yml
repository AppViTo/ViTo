spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        
        - id: social-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/social/**
        
        - id: event-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/events/**
        
        - id: checkin-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/checkin/**
        
        - id: mosaic-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/mosaic/**
        
        - id: streaming-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/streaming/**
        
        - id: archive-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/archive/**
        
        - id: chat-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/chat/**
        
        - id: media-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/media/**

        # WebSocket crudo (ADR-006). JwtAuthenticationFilter valida ?token= y cierra con 4401.
        - id: checkin-ws
          uri: ws://localhost:8084
          predicates:
            - Path=/ws/checkin/**

        - id: mosaic-ws
          uri: ws://localhost:8085
          predicates:
            - Path=/ws/mosaic/**

        - id: streaming-ws
          uri: ws://localhost:8086
          predicates:
            - Path=/ws/streaming/**

        - id: chat-ws
          uri: ws://localhost:8088
          predicates:
            - Path=/ws/chat/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
