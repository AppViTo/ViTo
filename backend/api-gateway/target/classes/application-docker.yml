spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
        
        - id: social-service
          uri: http://social-service:8082
          predicates:
            - Path=/api/v1/social/**
        
        - id: event-service
          uri: http://event-service:8083
          predicates:
            - Path=/api/v1/events/**
        
        - id: checkin-service
          uri: http://checkin-service:8084
          predicates:
            - Path=/api/v1/checkin/**
        
        - id: mosaic-service
          uri: http://mosaic-service:8085
          predicates:
            - Path=/api/v1/mosaic/**
        
        - id: streaming-service
          uri: http://streaming-service:8086
          predicates:
            - Path=/api/v1/streaming/**
        
        - id: archive-service
          uri: http://archive-service:8087
          predicates:
            - Path=/api/v1/archive/**
        
        - id: chat-service
          uri: http://chat-service:8088
          predicates:
            - Path=/api/v1/chat/**
        
        - id: media-service
          uri: http://media-service:8089
          predicates:
            - Path=/api/v1/media/**
        
        - id: transcode-service
          uri: http://transcode-service:8000
          predicates:
            - Path=/api/v1/transcode/**
        
        - id: recommendation-service
          uri: http://recommendation-service:8001
          predicates:
            - Path=/api/v1/recommendations/**
        
        - id: moderation-service
          uri: http://moderation-service:8002
          predicates:
            - Path=/api/v1/moderation/**

  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:vito-super-secret-jwt-key-change-in-production-2024}
