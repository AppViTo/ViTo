# Perfil de producción (docker-compose.prod.yml activa prod).
# application.yml deja com.vito.media en DEBUG para desarrollo; en prod ese nivel registra datos
# de cada subida y, con el tope de logs por contenedor, borra en minutos lo que haría falta para
# diagnosticar un incidente (docs/runbooks/incident.md). software.amazon.awssdk sigue en WARN.
logging:
  level:
    com.vito.media: INFO

# T-I13/T053: muestreo bajo para el free tier y envío OTLP HTTP a Alloy (que reenvía a Grafana Cloud).
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://alloy:4318/v1/traces}
