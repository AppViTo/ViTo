spring:
  application:
    name: media-service
  
  profiles:
    active: dev
  
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: vito_db
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: media-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Sin broker, send() bloquea hasta max.block.ms (60 s por defecto)
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
  
  servlet:
    multipart:
      enabled: true
      # CONVENTIONS §8: 10 MB por archivo; el request suma eventId y las cabeceras multipart
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8089
  tomcat:
    # Tomcat rechaza por Content-Length sin leer el cuerpo y, si lo que queda supera este valor,
    # corta la conexión en vez de enviar el 400 (T-B19). Con 20 MB, una subida de hasta 20 MB
    # recibe el error de ADR-003; las más grandes se cortan sin leerlas.
    max-swallow-size: 20MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# Almacenamiento S3 (ADR-011): SeaweedFS en local, Cloudflare R2 en producción.
# Valores de R2 en .env.example.
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET:vito-media}
  path-style: ${S3_PATH_STYLE:true}
  create-bucket: ${S3_CREATE_BUCKET:true}
  public-url: ${S3_PUBLIC_URL:}

# Media Configuration
media:
  max-file-size: 10485760  # 10MB (CONVENTIONS §8)
  allowed-types: image/jpeg,image/png,image/webp,video/mp4
  thumbnail-width: 200
  thumbnail-height: 200
  max-image-width: 1920
  max-image-height: 1080

# Logging
logging:
  level:
    com.vito.media: DEBUG
    software.amazon.awssdk: WARN

# Actuator: health para Docker/K8s (liveness/readiness)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
