spring:
  application:
    name: media-service
  
  profiles:
    active: dev
  
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: vito_db
  
  redis:
    host: localhost
    port: 6379
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: media-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8089

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# S3/MinIO Configuration
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET:vito-media}

# Media Configuration
media:
  max-file-size: 104857600  # 100MB
  allowed-types: image/jpeg,image/png,image/gif,video/mp4,video/webm,audio/mpeg
  thumbnail-width: 200
  thumbnail-height: 200
  max-image-width: 1920
  max-image-height: 1080

# Logging
logging:
  level:
    com.vito.media: DEBUG
    software.amazon.awssdk: WARN
