name: vito_app
description: ViTo - Social Event Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  shimmer: ^4.0.0
  pull_to_refresh: ^2.0.0
  
  # Camera & Media
  image_picker: ^1.0.5
  camera: ^0.10.5+7
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  # Video Player
  video_player: ^2.8.1
  chewie: ^1.7.4
  
  # Utils
  intl: ^0.20.3
  uuid: ^4.2.1
  dartz: ^0.10.1
  share_plus: ^7.2.1
  
  # Dependency Injection
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5
  mockito: ^5.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
