name: vito_app
description: ViTo - Social Event Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  
  # Networking
  dio: ^5.4.0
  web_socket_channel: ^3.0.3
  
  # Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  
  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  shimmer: ^4.0.0
  pull_to_refresh: ^2.0.0
  
  # Camera & Media
  image_picker: ^1.2.4
  camera: ^0.12.1
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  
  # Video Player
  video_player: ^2.14.1
  chewie: ^1.7.4
  
  # Utils
  intl: ^0.20.3
  uuid: ^4.2.1
  dartz: ^0.10.1
  share_plus: ^13.3.1
  
  # Dependency Injection
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  bloc_test: ^10.0.0
  mockito: ^5.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
