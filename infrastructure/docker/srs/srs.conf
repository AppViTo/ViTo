# ViTo SRS Media Server Configuration (SRS 5)
# RTMP para publicar, HTTP-FLV/HLS para reproducir y WebRTC (WHIP/WHEP).
# Validar cambios con: docker run --rm -v ./srs.conf:/c.conf ossrs/srs:5 ./objs/srs -t -c /c.conf

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       trace;

# HTTP API de gestión (lo usa streaming-service)
http_api {
    enabled         on;
    listen          1985;
}

# HTTP server para HLS / HTTP-FLV
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# WebRTC: candidate = IP que verán los clientes (en local, la del host)
rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    gop_cache       on;

    # HTTP-FLV de baja latencia
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     15;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }
}
