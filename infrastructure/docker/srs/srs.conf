# ViTo SRS Media Server Configuration
# Optimized for live streaming with WebRTC support

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HTTP API for management
http_api {
    enabled         on;
    listen          1985;
}

# HTTP Server for HLS/DASH/FLV
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# RTC (WebRTC) configuration
rtc {
    enabled         on;
    rtmp_to_rtc     on;
    rtc_to_rtmp     on;
    nack            on;
    tcp_nodelay     on;
    idle_timeout    30s;
    drop_for_publish on;
    pli_for_rtmp    on;
    rtp_cache       1000;
}

# VHost configuration
vhost __defaultVhost__ {
    # GOP cache for faster playback
    gop_cache       on;
    gop_cache_num   2;
    gop_cache_infinity off;
    
    # Real-time latency settings
    real_time {
        enabled     on;
    }
    
    # HTTP-FLV for low latency
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    
    # HLS settings
    hls {
        enabled         on;
        hls_fragment    2s;
        hls_window      10s;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     15;
    }
    
    # DASH settings
    dash {
        enabled         on;
        dash_fragment   2s;
        dash_window     10s;
        dash_path       ./objs/nginx/html;
        dash_mpd_file   [app]/[stream].mpd;
        dash_init_file  [app]/[stream]-init.mp4;
        dash_ts_prefix  [app]/[stream];
        dash_cleanup    on;
        dash_dispose    15;
    }
    
    # WebRTC settings for live
    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
        nack            on;
        tcp_nodelay     on;
        pli_for_rtmp    on;
        rtp_cache       1000;
    }
    
    # Ingest for transcoding
    ingest {
        enabled         off;
    }
    
    # Security - Token authentication (optional)
    # security {
    #     enabled on;
    #     allow read, publish, play;
    #     deny all;
    # }
}

# Logging
log_tank            console;
log_level           trace;
log_file            ./objs/srs.log;
