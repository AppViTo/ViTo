apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: vito
  labels:
    app: media-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
      - name: media-service
        image: vito/media-service:latest
        ports:
        - containerPort: 8089
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vito-secrets
              key: jwt-secret
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: vito-secrets
              key: mongodb-uri
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: S3_ENDPOINT
          value: "http://minio:9000"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: vito-secrets
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: vito-secrets
              key: s3-secret-key
        - name: S3_BUCKET
          value: "vito-media"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8089
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: upload-storage
          mountPath: /tmp/uploads
      volumes:
      - name: upload-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: vito
spec:
  selector:
    app: media-service
  ports:
  - port: 8089
    targetPort: 8089
  type: ClusterIP
