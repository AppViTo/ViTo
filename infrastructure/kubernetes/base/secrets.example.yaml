# PLANTILLA — NO aplicar tal cual y NO commitear valores reales.
# Los valores reales se crean fuera del repo, p. ej.:
#
#   kubectl -n vito create secret generic vito-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=qr-secret="$(openssl rand -base64 48)" \
#     --from-literal=mongodb-uri='mongodb://<user>:<pass>@<host>:27017/?authSource=admin' \
#     --from-literal=s3-access-key='<key>' \
#     --from-literal=s3-secret-key='<secret>' \
#     --from-literal=redis-password='<password>'
#
# En producción: External Secrets / Sealed Secrets / gestor del proveedor cloud.
apiVersion: v1
kind: Secret
metadata:
  name: vito-secrets
  namespace: vito
type: Opaque
stringData:
  jwt-secret: "<CHANGE_ME>"
  qr-secret: "<CHANGE_ME>"
  mongodb-uri: "<CHANGE_ME>"
  s3-access-key: "<CHANGE_ME>"
  s3-secret-key: "<CHANGE_ME>"
  redis-password: "<CHANGE_ME>"
