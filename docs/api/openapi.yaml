openapi: 3.1.0
info:
  title: ViTo API
  description: |
    ViTo is a social event lifecycle platform that integrates event creation, 
    digital invitations, RSVP, live mosaic, streaming, and post-event archiving.

    El evento se modela con la estructura anidada de ADR-001
    (`title` + `details` + `settings` + `stats`), no con campos planos.
  version: 1.0.0
  contact:
    name: ViTo Team
    email: api@vito.com

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.vito.com
    description: Production

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Auth Schemas
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          description: Nombre visible. Opcional (ADR-004).

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    # ADR-004: misma forma en register, login y refresh. Sin `tokenType`
    # (el cliente siempre usa Bearer).
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Segundos hasta que expira el access token (ADR-004).
          example: 86400
        user:
          $ref: '#/components/schemas/AuthUser'

    # Usuario de auth (ADR-004), plano. El perfil completo con stats es `User`
    # y lo sirve social-service (Ola 2).
    AuthUser:
      type: object
      required: [id, username, email]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: [string, 'null']
        avatar:
          type: [string, 'null']

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        profile:
          $ref: '#/components/schemas/UserProfile'
        stats:
          $ref: '#/components/schemas/UserStats'

    UserProfile:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        avatar:
          type: string
        coverImage:
          type: string

    UserStats:
      type: object
      properties:
        followersCount:
          type: integer
        followingCount:
          type: integer
        postsCount:
          type: integer
        streamsCount:
          type: integer

    # Event Schemas — ADR-001 (docs/decisions/adr-001-event-structure.md)
    EventDetails:
      type: object
      description: Fecha, lugar, geolocalización, imágenes y clasificación del evento.
      properties:
        startDate:
          type: string
          format: date-time
          description: ISO-8601 UTC con sufijo Z.
          example: '2026-10-12T23:00:00.000Z'
        endDate:
          type: string
          format: date-time
          description: Debe ser estrictamente posterior a `startDate`.
          example: '2026-10-13T07:00:00.000Z'
        location:
          type: string
          maxLength: 300
          description: Nombre del lugar libre. No es un objeto anidado.
          example: Hacienda El Retiro
        address:
          type: string
          maxLength: 300
          example: Km 5 vía Chía
        latitude:
          type: number
          format: double
          example: 4.711
        longitude:
          type: number
          format: double
          example: -74.0721
        coverImages:
          type: array
          items:
            type: string
            format: uri
          example: ['https://cdn.vito.com/evt_1/cover.jpg']
        tags:
          type: array
          items:
            type: string
          example: [boda]
        category:
          type: string
          description: Enum SCREAMING_SNAKE_CASE. Valores fuera de la lista ⇒ 400.
          enum: [BIRTHDAY, MEETING, WEDDING, GRADUATION, TRAVEL, PARTY]
          example: WEDDING

    EventSettings:
      type: object
      description: Flags de visibilidad, capacidad y funcionalidad. Todos con default.
      properties:
        isPublic:
          type: boolean
          default: true
        requiresApproval:
          type: boolean
          default: false
        maxAttendees:
          type: integer
          minimum: 0
          default: 100
          description: 0 significa sin límite de cupo.
        allowGuestInvites:
          type: boolean
          default: true
        enableLiveStreaming:
          type: boolean
          default: true
        enableMosaic:
          type: boolean
          default: true
        hideAddressUntilAccepted:
          type: boolean
          default: false
          description: >
            Si es `true`, un invitado cuyo RSVP no está `ACCEPTED` solo ve el
            barrio, no la dirección exacta. El organizador siempre ve la
            dirección completa.

    EventStats:
      type: object
      description: >
        Contadores derivados. **Solo lectura**, calculados por el backend.
        Quien no es el organizador recibe únicamente `totalAccepted`; el resto
        de contadores solo se expone al organizador (R7).
      properties:
        totalInvited:
          type: integer
          default: 0
        totalAccepted:
          type: integer
          default: 0
        totalDeclined:
          type: integer
          default: 0
        totalMaybe:
          type: integer
          default: 0
        totalWaitlisted:
          type: integer
          default: 0
        totalCheckedIn:
          type: integer
          default: 0
        totalViewers:
          type: integer
          default: 0

    CreateEventRequest:
      type: object
      required: [title]
      description: Body de `POST /api/v1/events`. Sin campos planos en la raíz.
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: Los 30 de Marta
        description:
          type: string
          maxLength: 2000
          example: Te espero con toda el alma
        details:
          $ref: '#/components/schemas/EventDetails'
        settings:
          $ref: '#/components/schemas/EventSettings'

    Event:
      type: object
      required: [id, organizerId, title, status]
      description: |
        Recurso Event según ADR-001. No existen `name`, `date`, `endDate`,
        `location`, `isPublic`, `maxAttendees`, `currentAttendees` ni `category`
        en la raíz: todo vive dentro de `details` / `settings` / `stats`.
      properties:
        id:
          type: string
          example: evt_01H8X2K4QJ
        organizerId:
          type: string
          example: usr_01H8X2K4QJ
        organizerDisplayName:
          type: [string, 'null']
          description: Nombre visible del organizador, tomado de `X-User-Name`.
          example: Alex Villa
        title:
          type: string
          example: Los 30 de Marta
        description:
          type: string
          nullable: true
        details:
          $ref: '#/components/schemas/EventDetails'
        settings:
          $ref: '#/components/schemas/EventSettings'
        stats:
          $ref: '#/components/schemas/EventStats'
        status:
          type: string
          description: Enum de CONVENTIONS §6. Un valor desconocido se trata como `DRAFT`.
          enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED]
          example: PUBLISHED
        createdAt:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00Z'

    # Ola 1 — Eventos, invitaciones y RSVP
    Rsvp:
      type: object
      required: [eventId, userId, status, respondedAt]
      description: Respuesta de un usuario a un evento. Sin QR ni `guestsCount`.
      properties:
        eventId:
          type: string
          example: evt_01H8X2K4QJ
        userId:
          type: string
          example: usr_01H8X2K4QV
        status:
          type: string
          description: Enum de CONVENTIONS §6.
          enum: [PENDING, ACCEPTED, DECLINED, MAYBE, WAITLISTED]
          example: ACCEPTED
        message:
          type: [string, 'null']
          maxLength: 280
          example: ¡Ahí estaré!
        respondedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC con sufijo Z.
          example: '2026-10-28T02:10:00Z'
        waitlistedAt:
          type: [string, 'null']
          format: date-time
          description: Presente solo si el RSVP está en lista de espera.
          example: null

    RespondRsvpRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED, DECLINED, MAYBE]
          example: ACCEPTED
        message:
          type: string
          maxLength: 280
          example: ¡Ahí estaré!

    Attendee:
      type: object
      required: [userId, status, respondedAt]
      description: Asistente visible solo para el organizador. Sin correo ni teléfono.
      properties:
        userId:
          type: string
          example: usr_01H8X2K4QV
        displayName:
          type: [string, 'null']
          example: Carolina Martínez
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, MAYBE, WAITLISTED]
          example: ACCEPTED
        respondedAt:
          type: string
          format: date-time
          example: '2026-10-28T02:10:00Z'

    UpdateEventRequest:
      type: object
      description: >
        Cuerpo parcial de `PATCH /events/{eventId}`
        (`application/merge-patch+json`). Solo se envían los campos que cambian;
        `id`, `organizerId`, `status`, `stats` y `createdAt` no son editables.
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: Los 30 de Marta
        description:
          type: [string, 'null']
          maxLength: 2000
          example: Te espero con toda el alma
        details:
          $ref: '#/components/schemas/EventDetails'
        settings:
          $ref: '#/components/schemas/EventSettings'

    Invitation:
      type: object
      required: [id, eventId, inviterId, inviteeId, status, sentAt]
      description: Invitación a un evento. Enum de status en CONVENTIONS §6.
      properties:
        id:
          type: string
          example: inv_01HA1B2C3D
        eventId:
          type: string
          example: evt_01H8X2K4QJ
        inviterId:
          type: string
          example: usr_01H8X2K4QJ
        inviteeId:
          type: string
          example: usr_01H8X2K4QV
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
          example: PENDING
        message:
          type: [string, 'null']
          maxLength: 280
          example: ¡Te espero!
        inviteLinkId:
          type: [string, 'null']
          description: Enlace por el que llegó el invitado; null si se invitó desde la app.
          example: null
        sentAt:
          type: string
          format: date-time
          description: ISO-8601 UTC con sufijo Z.
          example: '2026-10-28T02:10:00Z'
        expiresAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-04T02:10:00Z'
        respondedAt:
          type: [string, 'null']
          format: date-time
          example: null

    SendInvitationRequest:
      type: object
      required: [inviteeId]
      properties:
        inviteeId:
          type: string
          description: Usuario registrado que se invita.
          example: usr_01H8X2K4QV
        message:
          type: string
          maxLength: 280
          example: ¡Te espero!

    InviteLink:
      type: object
      description: >
        Enlace de invitación. Solo lo ve el organizador. El token es secreto:
        quien lo tiene puede unirse mientras el enlace esté vigente.
      required: [id, eventId, token, url, expiresAt, uses, revoked, createdAt]
      properties:
        id:
          type: string
          example: inl_01HA1B2C3D
        eventId:
          type: string
          example: evt_01H8X2K4QJ
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: 22 caracteres base64url (128 bits aleatorios).
          example: k3J9xQ2mV7pL1sT8wY4zBc
        url:
          type: string
          format: uri
          example: https://app.vitoevents.app/i/k3J9xQ2mV7pL1sT8wY4zBc
        expiresAt:
          type: string
          format: date-time
          example: '2026-11-03T15:00:00Z'
        maxUses:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: null significa sin límite de usos.
          example: null
        uses:
          type: integer
          minimum: 0
          example: 0
        revoked:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-10-27T15:00:00Z'

    CreateInviteLinkRequest:
      type: object
      additionalProperties: false
      properties:
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
          example: 7
        maxUses:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: null significa sin límite de usos.
          example: null

    InviteLinkPreview:
      type: object
      description: >
        Lo mínimo para mostrar la invitación a alguien sin sesión. Nunca incluye
        la dirección exacta ni coordenadas, aunque el evento no oculte la dirección.
      required: [eventId, title, organizerDisplayName, expiresAt]
      properties:
        eventId:
          type: string
          example: evt_01H8X2K4QJ
        title:
          type: string
          example: Cumple de Caro
        startDate:
          type: [string, 'null']
          format: date-time
          example: '2026-12-26T01:00:00Z'
        endDate:
          type: [string, 'null']
          format: date-time
          example: '2026-12-26T07:00:00Z'
        location:
          type: [string, 'null']
          description: Barrio o nombre del lugar, sin dirección exacta.
          example: Cartagena de Indias
        coverImage:
          type: [string, 'null']
          format: uri
          example: null
        category:
          type: [string, 'null']
          example: BIRTHDAY
        organizerDisplayName:
          type: string
          example: Bernardo
        expiresAt:
          type: string
          format: date-time
          example: '2026-11-03T15:00:00Z'

    # Chat Schemas
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [TEXT, IMAGE, VIDEO, AUDIO, FILE, SYSTEM, TYPING, READ_RECEIPT]
        mediaUrl:
          type: string
        timestamp:
          type: string
          format: date-time
        deleted:
          type: boolean

    ChatRoom:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [EVENT_CHAT, PRIVATE, GROUP]
        participantIds:
          type: array
          items:
            type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
        unreadCount:
          type: integer

    # Media Schemas
    Media:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        uploadedBy:
          type: string
        fileName:
          type: string
        originalFileName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        status:
          type: string
          enum: [UPLOADING, UPLOADED, PROCESSING, PROCESSED, FAILED]
        metadata:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
            duration:
              type: integer
            format:
              type: string
        location:
          type: object
          properties:
            bucket:
              type: string
            key:
              type: string
            url:
              type: string
              example: https://cdn.vito.com/evt_1/cover.jpg
            thumbnailUrl:
              type: string
        uploadedAt:
          type: string
          format: date-time

    # Ola 3 (T-C09, Principio IX)
    PresignedUrl:
      type: object
      required: [url, expiresIn, expiresAt]
      description: >
        URL prefirmada de lectura (GET) de un archivo de media. Caduca a los
        `expiresIn` segundos; después hay que pedir otra.
      properties:
        url:
          type: string
          format: uri
          example: https://vito-events.r2.cloudflarestorage.com/evt_01H8X/portada.jpg?X-Amz-Expires=900&X-Amz-Signature=3f1c
        expiresIn:
          type: integer
          description: Segundos de vida de la URL (como `AuthResponse.expiresIn`, ADR-004).
          minimum: 1
          maximum: 3600
          example: 900
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-16T22:30:00Z'

    # Mosaic Schemas — Ola 3 (T-C07). Mismo MosaicFeedItem que asyncapi.yaml.
    MosaicFeedItem:
      type: object
      required: [id, eventId, userId, type, timestamp, likesCount, commentsCount, isLiked]
      description: >
        Elemento del feed del mosaico. `isLiked` es relativo al usuario que
        consulta (`X-User-Id`). Los elementos retirados por el organizador no
        aparecen en ninguna respuesta.
      properties:
        id:
          type: string
          example: mos_01H8X2K4QJ
        eventId:
          type: string
        userId:
          type: string
        username:
          type: string
        displayName:
          type: [string, 'null']
        avatar:
          type: [string, 'null']
        type:
          type: string
          enum: [CHECK_IN, POST, PHOTO, REACTION, STORY, LIVE_UPDATE, ANNOUNCEMENT]
        content:
          type: [string, 'null']
        mediaUrls:
          type: array
          items:
            type: string
            format: uri
        timestamp:
          type: string
          format: date-time
        likesCount:
          type: integer
          minimum: 0
        commentsCount:
          type: integer
          minimum: 0
        isLiked:
          type: boolean

    MosaicItem:
      type: object
      required: [id, eventId, userId, type, timestamp, position]
      description: Celda ocupada de la grilla del mosaico.
      properties:
        id:
          type: string
          description: Mismo `id` que el `MosaicFeedItem` que la ocupa.
        eventId:
          type: string
        userId:
          type: string
        username:
          type: string
        displayName:
          type: [string, 'null']
        avatar:
          type: [string, 'null']
        type:
          type: string
          enum: [CHECK_IN, POST, PHOTO, REACTION, STORY, HIGHLIGHT]
        content:
          type: [string, 'null']
        mediaUrl:
          type: [string, 'null']
          format: uri
        timestamp:
          type: string
          format: date-time
        position:
          type: object
          required: [row, col, width, height]
          properties:
            row:
              type: integer
              minimum: 0
            col:
              type: integer
              minimum: 0
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        likesCount:
          type: integer
          minimum: 0
        commentsCount:
          type: integer
          minimum: 0

    MosaicGrid:
      type: object
      required: [eventId, grid, totalItems, lastUpdatedIndex]
      description: >
        Retícula del mosaico: `grid[fila][columna]`, con `null` en las celdas
        vacías. `lastUpdatedIndex` es `fila * columnas + columna` de la última
        celda ocupada, o `-1` si no hay ninguna.
      properties:
        eventId:
          type: string
        grid:
          type: array
          items:
            type: array
            items:
              oneOf:
                - $ref: '#/components/schemas/MosaicItem'
                - type: 'null'
        totalItems:
          type: integer
          minimum: 0
        lastUpdatedIndex:
          type: integer
          minimum: -1
        lastUpdatedAt:
          type: [string, 'null']
          format: date-time

    CreateMosaicPostRequest:
      type: object
      required: [eventId, mediaId]
      description: >
        Publica en el mosaico una imagen ya subida con `uploadMedia`
        (ADR-016). Mientras rija la excepción A3 solo se aceptan imágenes.
      properties:
        eventId:
          type: string
        mediaId:
          type: string
          description: >
            `id` del `Media` devuelto por `uploadMedia`. Debe ser del mismo
            `eventId`, subido por el mismo usuario y de tipo `image/jpeg`,
            `image/png` o `image/webp`.
        content:
          type: [string, 'null']
          maxLength: 500
          description: Texto opcional que acompaña la foto.

    MosaicLikeState:
      type: object
      required: [itemId, likesCount, isLiked]
      description: Estado del like tras la acción. Dar o quitar el like es idempotente.
      properties:
        itemId:
          type: string
        likesCount:
          type: integer
          minimum: 0
        isLiked:
          type: boolean

    # Error Response — ADR-003 (docs/decisions/adr-003-error-envelope.md)
    ErrorResponse:
      type: object
      required: [error, message, status, timestamp]
      description: >
        Envelope único de todo 4xx/5xx. `message` es obligatorio en es-ES
        porque el frontend lo muestra tal cual al usuario.
      properties:
        error:
          type: string
          description: Código de máquina en SCREAMING_SNAKE_CASE.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Mensaje legible para humanos, en es-ES.
          example: El campo title es obligatorio
        status:
          type: integer
          description: Espeljo del status line HTTP.
          example: 400
        timestamp:
          type: string
          format: date-time
          example: '2026-10-02T14:03:22Z'
        details:
          type: object
          description: Solo en validación.
          additionalProperties:
            type: string
          example:
            title: Mínimo 3 caracteres

paths:
  # Auth Endpoints
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: >
        Registra un usuario y devuelve los tokens del ciclo unificado (ADR-004).
        Endpoint público: no requiere `Authorization`.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Usuario ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      description: >
        Autentica con email y contraseña. Endpoint público: no requiere
        `Authorization`.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: >
        Intercambia un `refreshToken` válido por un nuevo par de tokens.
        Endpoint público.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token inválido o revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      description: >
        Revoca el token actual. Debe ir en la blacklist de Redis.
      operationId: logoutUser
      responses:
        '204':
          description: Sesión cerrada (sin cuerpo, ADR-004)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: >
        Devuelve el usuario autenticado con la misma forma que
        `AuthResponse.user` (ADR-004). La identidad sale de `X-User-Id`.
      operationId: getCurrentUser
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Token ausente, inválido o revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: UNAUTHORIZED
                message: El token de acceso es inválido o ha expirado
                status: 401
                timestamp: '2026-10-28T02:10:00Z'

  # Event Endpoints — contrato ADR-001
  /api/v1/events:
    post:
      tags: [Events]
      summary: Create a new event
      description: >
        Crea un evento con la estructura anidada de ADR-001. El `organizerId`
        se toma del header `X-User-Id` inyectado por el gateway (ADR-007);
        nunca del body. La portada se sube aparte con `POST /media/upload`
        una vez creado el evento.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              title: Los 30 de Marta
              description: Te espero con toda el alma
              details:
                startDate: '2026-08-23T01:00:00.000Z'
                endDate: '2026-08-23T07:00:00.000Z'
                address: Cra. 7 #63-14, Chapinero Alto
                category: BIRTHDAY
              settings:
                isPublic: false
                requiresApproval: false
                maxAttendees: 100
                allowGuestInvites: false
                enableLiveStreaming: true
                enableMosaic: true
                hideAddressUntilAccepted: true
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              example:
                id: evt_01H8X2K4QJ
                organizerId: usr_01H8X2K4QJ
                title: Los 30 de Marta
                description: Te espero con toda el alma
                details:
                  startDate: '2026-08-23T01:00:00.000Z'
                  endDate: '2026-08-23T07:00:00.000Z'
                  address: Cra. 7 #63-14, Chapinero Alto
                  category: BIRTHDAY
                settings:
                  isPublic: false
                  requiresApproval: false
                  maxAttendees: 100
                  allowGuestInvites: false
                  enableLiveStreaming: true
                  enableMosaic: true
                  hideAddressUntilAccepted: true
                stats:
                  totalInvited: 0
                  totalAccepted: 0
                  totalDeclined: 0
                  totalMaybe: 0
                  totalWaitlisted: 0
                  totalCheckedIn: 0
                  totalViewers: 0
                status: PUBLISHED
                createdAt: '2026-10-02T14:03:22Z'
                updatedAt: '2026-10-02T14:03:22Z'
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_ERROR
                message: El campo title es obligatorio
                status: 400
                timestamp: '2026-10-02T14:03:22Z'
                details:
                  title: Mínimo 3 caracteres
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Rate limit superado (events: 20 req/s)"
          headers:
            Retry-After:
              description: Segundos hasta poder reintentar.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Events]
      summary: List user events
      description: >
        Lista eventos como **array plano** (ADR-002), no un envelope
        `{events, total}`: el frontend parsea `(response.data as List)`.
        `scope=mine` (por defecto) devuelve los eventos organizados por el
        usuario autenticado, en cualquier estado, orden `createdAt`
        descendente (CONVENTIONS §5). `scope=upcoming` devuelve los eventos
        `PUBLISHED`, públicos (`settings.isPublic: true`) y con
        `details.startDate` mayor o igual a ahora, orden `details.startDate`
        ascendente (excepción documentada a CONVENTIONS §5). `scope=invited`
        devuelve los eventos `PUBLISHED` y no vencidos con invitación `PENDING`
        (no expirada) o `ACCEPTED`, o con un RSVP distinto de `DECLINED`, orden
        `details.startDate` ascendente (ADR-014, enmienda de la Ola 1). La
        identidad sale solo de `X-User-Id` (ADR-007): no se aceptan
        `organizerId` ni `userId`. `hideAddressUntilAccepted` aplica igual que
        en `getEvent` (ADR-014).
      operationId: listEvents
      parameters:
        - name: scope
          in: query
          required: false
          description: >
            `mine`: eventos del usuario autenticado (cualquier estado).
            `upcoming`: eventos públicos publicados con `details.startDate`
            mayor o igual a ahora. `invited`: eventos publicados y no vencidos
            a los que el usuario fue invitado o respondió algo distinto de
            `DECLINED`. Por defecto `mine`, para no listar nunca un catálogo
            global (ADR-014).
          schema:
            type: string
            enum: [mine, upcoming, invited]
            default: mine
        - name: page
          in: query
          description: Base 0.
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Máximo 100 (ADR-008).
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: >
            Array plano de `Event`. `scope=mine` ordena por `createdAt`
            descendente; `scope=upcoming` e `invited` por `details.startDate`
            ascendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
              examples:
                mine:
                  summary: Eventos que organiza el usuario
                  value:
                    - id: evt_01H8X2K4QJ
                      organizerId: usr_01H8X2K4QJ
                      title: Los 30 de Marta
                      status: PUBLISHED
                      settings:
                        isPublic: false
                upcoming:
                  summary: Próximos eventos públicos
                  value:
                    - id: evt_01H9A1B2C3
                      organizerId: usr_01H8X2K4QK
                      title: Sunset Session en la terraza
                      status: PUBLISHED
                      details:
                        startDate: '2027-02-14T21:00:00.000Z'
                        endDate: '2027-02-15T03:00:00.000Z'
                        category: PARTY
                      settings:
                        isPublic: true
                invited:
                  summary: Eventos a los que el usuario fue invitado
                  value:
                    - id: evt_01H8X2K4QJ
                      organizerId: usr_01H8X2K4QJ
                      title: Los 30 de Marta
                      status: PUBLISHED
                      details:
                        startDate: '2026-08-23T01:00:00.000Z'
                        endDate: '2026-08-23T07:00:00.000Z'
                        category: BIRTHDAY
                      settings:
                        isPublic: false
        '400':
          description: >
            `scope` fuera del enum o `size` mayor que 100 (ADR-003, ADR-008).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_ERROR
                message: El scope debe ser mine, upcoming o invited
                status: 400
                timestamp: '2026-10-22T14:03:22Z'
                details:
                  scope: 'Valores permitidos: mine, upcoming, invited'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventId}:
    get:
      tags: [Events]
      summary: Get event by ID
      description: >
        Detalle de un evento. Aplica `settings.hideAddressUntilAccepted`:
        si el solicitante es un invitado sin RSVP `ACCEPTED`, la dirección
        exacta se sustituye por el barrio.
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            Evento completo. El organizador recibe todos los contadores; los
            demás reciben `stats` solo con `totalAccepted` (R7).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              examples:
                organizer:
                  summary: Vista del organizador (stats completo)
                  value:
                    id: evt_01H9ZP5RKM
                    organizerId: usr_01H8X2K4QJ
                    organizerDisplayName: Alex Villa
                    title: Boda Andrea & Luis
                    status: PUBLISHED
                    stats:
                      totalInvited: 120
                      totalAccepted: 96
                      totalDeclined: 4
                      totalMaybe: 10
                      totalWaitlisted: 3
                      totalCheckedIn: 80
                      totalViewers: 0
                guest:
                  summary: Vista de un invitado (stats reducido)
                  value:
                    id: evt_01H9ZP5RKM
                    organizerId: usr_01H8X2K4QJ
                    organizerDisplayName: Alex Villa
                    title: Boda Andrea & Luis
                    status: PUBLISHED
                    stats:
                      totalAccepted: 96
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NOT_FOUND
                message: El evento no existe
                status: 404
                timestamp: '2026-10-02T14:03:22Z'

    patch:
      tags: [Events]
      summary: Update an event
      description: >
        Edición parcial del evento por el organizador. Solo se envían los
        campos que cambian (`application/merge-patch+json`). `id`,
        `organizerId`, `status`, `stats` y `createdAt` no son editables; si
        llegan, responden `400`. Bajar `settings.maxAttendees` por debajo de
        `stats.totalAccepted` responde `409`.
      operationId: updateEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Evento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Validación fallida o campo no editable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el organizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cupo menor que los confirmados o evento no vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                capacity:
                  summary: El cupo no puede bajar de los confirmados
                  value:
                    error: CONFLICT
                    message: El cupo no puede ser menor que los 96 confirmados
                    status: 409
                    timestamp: '2026-10-28T02:10:00Z'
                state:
                  summary: Evento cancelado o terminado
                  value:
                    error: CONFLICT
                    message: No se puede editar un evento cancelado o terminado
                    status: 409
                    timestamp: '2026-10-28T02:10:00Z'

    delete:
      tags: [Events]
      summary: Cancel an event
      description: >
        Cancela el evento (pasa a `CANCELLED`) sin borrarlo. Es idempotente:
        cancelar un evento ya cancelado responde `204`. Un evento `COMPLETED`
        responde `409`.
      operationId: cancelEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Evento cancelado (sin cuerpo)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el organizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El evento ya terminó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventId}/rsvp:
    post:
      tags: [Events]
      summary: Respond to an event
      description: >
        Única forma de responder una invitación. Es un upsert idempotente: la
        misma respuesta repetida no duplica ni cambia contadores. Si el cupo
        está lleno, un `ACCEPTED` queda en `WAITLISTED`. Un evento privado sin
        acceso responde el mismo `404` que uno inexistente.
      operationId: respondRsvp
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondRsvpRequest'
      responses:
        '200':
          description: Respuesta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rsvp'
              examples:
                accepted:
                  summary: Confirmado con cupo
                  value:
                    eventId: evt_01H8X2K4QJ
                    userId: usr_01H8X2K4QV
                    status: ACCEPTED
                    message: ¡Ahí estaré!
                    respondedAt: '2026-10-28T02:10:00Z'
                    waitlistedAt: null
                waitlisted:
                  summary: Confirmado sin cupo, en lista de espera
                  value:
                    eventId: evt_01H8X2K4QJ
                    userId: usr_01H8X2K4QW
                    status: WAITLISTED
                    message: null
                    respondedAt: '2026-10-28T02:12:00Z'
                    waitlistedAt: '2026-10-28T02:12:00Z'
        '400':
          description: Status inválido o mensaje demasiado largo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Evento inexistente o privado sin acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: El evento no existe
                  value:
                    error: NOT_FOUND
                    message: El evento no existe
                    status: 404
                    timestamp: '2026-10-28T02:10:00Z'
                private:
                  summary: Evento privado sin invitación (mismo cuerpo)
                  value:
                    error: NOT_FOUND
                    message: El evento no existe
                    status: 404
                    timestamp: '2026-10-28T02:10:00Z'
        '409':
          description: Organizador, evento cancelado, terminado o pasado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Rate limit superado (rsvp: 20 req/s)"
          headers:
            Retry-After:
              description: Segundos hasta poder reintentar.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

