          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Enlace revocado (sin cuerpo)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el organizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Evento o enlace inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/invite-links/{token}:
    get:
      tags: [Events]
      summary: Preview an invite link
      description: >
        Vista previa pública de un enlace vigente. Nunca incluye la dirección
        exacta ni coordenadas. Un token inexistente, vencido o revocado
        responde el mismo `404`.
      operationId: getInviteLinkPreview
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22}$'
      responses:
        '200':
          description: Vista previa del enlace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLinkPreview'
        '404':
          description: El enlace no existe o ya no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Rate limit por IP superado (preview: 10/min)"
          headers:
            Retry-After:
              description: Segundos hasta poder reintentar.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/invite-links/{token}/accept:
    post:
      tags: [Events]
      summary: Accept an invite link
      description: >
        Une al usuario autenticado al evento. Es idempotente: si ya tiene
        invitación, devuelve la existente sin sumar un uso. Si el usuario es
        el organizador, responde `200` sin crear nada.
      operationId: acceptInviteLink
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22}$'
      responses:
        '200':
          description: Invitación existente o creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El enlace no existe o ya no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Límite de usos alcanzado o evento no vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                max-uses:
                  summary: El enlace alcanzó su límite de usos
                  value:
                    error: CONFLICT
                    message: El enlace alcanzó su límite de usos
                    status: 409
                    timestamp: '2026-10-28T02:10:00Z'
                event-not-active:
                  summary: El evento no está vigente
                  value:
                    error: CONFLICT
                    message: El evento ya no admite invitados
                    status: 409
                    timestamp: '2026-10-28T02:10:00Z'
        '429':
          description: Rate limit por usuario superado
          headers:
            Retry-After:
              description: Segundos hasta poder reintentar.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Chat Endpoints
  /api/v1/chat/rooms:
    post:
      tags: [Chat]
      summary: Create a chat room
      description: Crea una sala de chat asociada a un evento.
      operationId: createChatRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  enum: [EVENT_CHAT, PRIVATE, GROUP]
                participantIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chat/rooms/{roomId}/join:
    post:
      tags: [Chat]
      summary: Join a chat room
      description: Añade al usuario autenticado a la sala.
      operationId: joinChatRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chat/messages:
    post:
      tags: [Chat]
      summary: Send a message
      description: Persiste un mensaje y lo retransmite por el WebSocket de la sala.
      operationId: sendChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, content]
              properties:
                roomId:
                  type: string
                content:
                  type: string
                  maxLength: 5000
                type:
                  type: string
                  enum: [TEXT, IMAGE, VIDEO, AUDIO, FILE, SYSTEM, TYPING, READ_RECEIPT]
                mediaUrl:
                  type: string
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chat/rooms/{roomId}/messages:
    get:
      tags: [Chat]
      summary: Get room messages
      description: >
        Mensajes de una sala. Devuelve **array plano** (ADR-002); no existe
        `total` en la respuesta (ADR-008).
      operationId: listChatMessages
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Array plano de mensajes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Media Endpoints
  /api/v1/media/upload:
    post:
      tags: [Media]
      summary: Upload media file
      description: >
        Sube la portada de un evento o una foto del mosaico (primer paso de
        `createMosaicPost`, ADR-016). Multipart con `file` + `eventId`.
        Tamaño máximo 10 MB; formatos `image/jpeg`, `image/png` e
        `image/webp`. Mientras rija la excepción A3 no se acepta `video/mp4`
        (CONVENTIONS §8). Toma la identidad del header
        `X-User-Id` inyectado por el gateway (CONVENTIONS §2.2): sin ese
        header devuelve 400.
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, eventId]
              properties:
                file:
                  type: string
                  format: binary
                eventId:
                  type: string
      responses:
        '201':
          description: Media uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
              example:
                id: med_01H8X2K4QJ
                eventId: evt_01H8X2K4QJ
                uploadedBy: usr_01H8X2K4QJ
                fileName: portada.jpg
                contentType: image/jpeg
                fileSize: 482113
                status: UPLOADED
                location:
                  bucket: vito-events
                  key: evt_01H8X/portada.jpg
                  url: https://cdn.vito.com/evt_01H8X/portada.jpg
                  thumbnailUrl: https://cdn.vito.com/evt_01H8X/thumb_portada.jpg
                uploadedAt: '2026-10-02T14:03:22Z'
        '400':
          description: Archivo ausente, tipo no permitido, > 10 MB o `eventId` vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/media/{mediaId}:
    get:
      tags: [Media]
      summary: Get media by ID
      description: Devuelve los metadatos y la localización de un archivo ya subido.
      operationId: getMedia
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Media]
      summary: Delete media
      description: >
        Ola 3 (T-C09). Borra el archivo y su miniatura del almacenamiento y el
        registro de media. Pueden borrar quien lo subió (`uploadedBy`) y el
        organizador del evento. La identidad sale de `X-User-Id` (ADR-007). Si
        el archivo está publicado en el mosaico, retirarlo es
        `removeMosaicItem`, que también borra el archivo.
      operationId: deleteMedia
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Archivo borrado
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no subió el archivo ni organiza el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/media/{mediaId}/presigned-url:
    get:
      tags: [Media]
      summary: Get a presigned URL for a media file
      description: >
        Ola 3 (T-C09, Principio IX). Devuelve una URL prefirmada de lectura y
        vida corta. Mismo acceso que `listEventMedia`: el organizador del
        evento y los usuarios con RSVP `ACCEPTED`. En esta ola el bucket sigue
        público y `Media.location.url` no cambia; esta operación es la vía
        prevista cuando el bucket pase a privado.
      operationId: getMediaPresignedUrl
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
        - name: expiresIn
          in: query
          description: Segundos de vida de la URL. Por defecto 900, máximo 3600.
          schema:
            type: integer
            default: 900
            minimum: 1
            maximum: 3600
      responses:
        '200':
          description: URL prefirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrl'
              example:
                url: https://vito-events.r2.cloudflarestorage.com/evt_01H8X/portada.jpg?X-Amz-Expires=900&X-Amz-Signature=3f1c
                expiresIn: 900
                expiresAt: '2026-10-16T22:30:00Z'
        '400':
          description: '`expiresIn` fuera de 1–3600'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es organizador ni tiene RSVP `ACCEPTED` en el evento del archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/media/event/{eventId}:
    get:
      tags: [Media]
      summary: List the media of an event
      description: >
        Ola 3 (T-C09). Archivos subidos al evento como **array plano**
        (ADR-002), orden `uploadedAt` descendente, paginado con `page`/`size`
        (CONVENTIONS §5). Lo ven el organizador y los usuarios con RSVP
        `ACCEPTED`. No incluye los archivos retirados del mosaico:
        `removeMosaicItem` los borra.
      operationId: listEventMedia
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Base 0.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Máximo 100 (ADR-008).
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Array plano de `Media`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'
              example:
                - id: med_01H8X2K4QK
                  eventId: evt_01H8X2K4QJ
                  uploadedBy: usr_01H8X2K4QL
                  fileName: brindis.jpg
                  contentType: image/jpeg
                  fileSize: 391204
                  status: UPLOADED
                  location:
                    bucket: vito-events
                    key: evt_01H8X/brindis.jpg
                    url: https://cdn.vito.com/evt_01H8X/brindis.jpg
                    thumbnailUrl: https://cdn.vito.com/evt_01H8X/thumb_brindis.jpg
                  uploadedAt: '2026-10-16T22:20:00Z'
        '400':
          description: '`page` negativo o `size` fuera de 1–100'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es organizador ni tiene RSVP `ACCEPTED` en el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Mosaic Endpoints — Ola 3 (T-C07, ADR-016, excepción A3)
  /api/v1/mosaic/post:
    post:
      tags: [Mosaic]
      summary: Publish a photo in the mosaic
      description: >
        Segundo paso de la subida (ADR-016): el cliente sube la imagen con
        `uploadMedia` y publica su `mediaId` aquí. Crea un elemento `PHOTO`
        que aparece al instante en feed y grilla y se avisa por
        `/ws/mosaic/{eventId}` con `NEW_ITEM` (post-moderación, excepción
        A3: no hay cola de aprobación). Pueden publicar el organizador y los
        usuarios con RSVP `ACCEPTED`. La identidad sale de `X-User-Id`
        (ADR-007).
      operationId: createMosaicPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMosaicPostRequest'
            example:
              eventId: evt_01H8X2K4QJ
              mediaId: med_01H8X2K4QJ
              content: ¡Qué noche!
      responses:
        '201':
          description: Elemento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicFeedItem'
              example:
                id: mos_01H8X2K4QJ
                eventId: evt_01H8X2K4QJ
                userId: usr_01H8X2K4QJ
                username: marta
                displayName: Marta Ruiz
                type: PHOTO
                content: ¡Qué noche!
                mediaUrls:
                  - https://cdn.vito.com/evt_01H8X/portada.jpg
                timestamp: '2026-10-16T22:15:00Z'
                likesCount: 0
                commentsCount: 0
                isLiked: false
        '400':
          description: >
            `eventId` o `mediaId` vacíos, `content` de más de 500 caracteres,
            o el `Media` no es una imagen, es de otro evento o lo subió otro
            usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VALIDATION_ERROR
                message: Solo se pueden publicar imágenes JPEG, PNG o WebP
                status: 400
                timestamp: '2026-10-16T22:15:00Z'
                details:
                  mediaId: El archivo no es una imagen
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            El usuario no es el organizador ni tiene RSVP `ACCEPTED`, o el
            evento tiene `settings.enableMosaic: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: FORBIDDEN
                message: Solo los asistentes confirmados pueden publicar en el mosaico
                status: 403
                timestamp: '2026-10-16T22:15:00Z'
        '404':
          description: El evento o el `Media` no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mosaic/feed/{eventId}:
    get:
      tags: [Mosaic]
      summary: List the mosaic feed
      description: >
        Feed del mosaico como **array plano** (ADR-002), orden `timestamp`
        descendente, paginado con `page`/`size` (ADR-008). No incluye los
        elementos retirados por el organizador. Lo ven el organizador y los
        invitados; si el evento es público, cualquier usuario autenticado.
      operationId: listMosaicFeed
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Base 0.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Máximo 100 (ADR-008).
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Array plano de `MosaicFeedItem`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MosaicFeedItem'
              example:
                - id: mos_01H8X2K4QK
                  eventId: evt_01H8X2K4QJ
                  userId: usr_01H8X2K4QL
                  username: luis
                  type: PHOTO
                  mediaUrls:
                    - https://cdn.vito.com/evt_01H8X/brindis.jpg
                  timestamp: '2026-10-16T22:20:00Z'
                  likesCount: 3
                  commentsCount: 0
                  isLiked: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >
            Evento privado del que el usuario no es organizador ni invitado, o
            `settings.enableMosaic: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mosaic/grid/{eventId}:
    get:
      tags: [Mosaic]
      summary: Get the mosaic grid
      description: >
        Estado actual de la grilla. Mismo acceso que `listMosaicFeed`. Una
        celda cuyo elemento retiró el organizador vuelve a `null`.
      operationId: getMosaicGrid
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grilla del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicGrid'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin acceso al mosaico del evento (ver `listMosaicFeed`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El evento no existe o su grilla no se inicializó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NOT_FOUND
                message: El mosaico de este evento todavía no está listo
                status: 404
                timestamp: '2026-10-16T22:15:00Z'

  /api/v1/mosaic/grid/{eventId}/initialize:
    post:
      tags: [Mosaic]
      summary: Initialize the mosaic grid
      description: >
        Crea la grilla vacía de `rows` × `cols` celdas. Solo el organizador
        del evento. Una sola vez por evento: si ya existe responde `409`.
      operationId: initializeMosaicGrid
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: rows
          in: query
          schema:
            type: integer
            default: 4
            minimum: 1
            maximum: 10
        - name: cols
          in: query
          schema:
            type: integer
            default: 4
            minimum: 1
            maximum: 10
      responses:
        '201':
          description: Grilla creada, con todas las celdas en `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicGrid'
              example:
                eventId: evt_01H8X2K4QJ
                grid:
                  - [null, null]
                  - [null, null]
                totalItems: 0
                lastUpdatedIndex: -1
                lastUpdatedAt: '2026-10-16T20:00:00Z'
        '400':
          description: "`rows` o `cols` fuera de 1..10"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el organizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La grilla ya estaba inicializada (ADR-009)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mosaic/item/{itemId}:
    get:
      tags: [Mosaic]
      summary: Get a mosaic item
      description: >
        Detalle de un elemento del feed. Mismo acceso que `listMosaicFeed`.
        Un elemento retirado responde `404`.
      operationId: getMosaicItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Elemento del mosaico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicFeedItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe, fue retirado o el usuario no tiene acceso al mosaico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Mosaic]
      summary: Remove a mosaic item (organizer moderation)
      description: >
        Moderación por el organizador (excepción A3, T-B26). Retira el
        elemento: deja de salir en feed, grilla y `getMosaicItem`, su celda
        vuelve a `null` y los clientes conectados reciben `ITEM_REMOVED` por
        `/ws/mosaic/{eventId}`. Solo el organizador del evento del elemento.
        El elemento es un borrado lógico (el servicio conserva el registro
        para auditoría), pero su archivo se borra del almacenamiento y deja de
        salir en `listEventMedia` (T-C09).
      operationId: removeMosaicItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Elemento retirado
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el organizador del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: FORBIDDEN
                message: Solo el organizador puede retirar fotos del mosaico
                status: 403
                timestamp: '2026-10-16T22:30:00Z'
        '404':
          description: El elemento no existe o ya fue retirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mosaic/item/{itemId}/like:
    post:
      tags: [Mosaic]
      summary: Like a mosaic item
      description: >
        Da like al elemento. Idempotente: repetirlo no suma otro. Los
        clientes conectados reciben `LIKE_UPDATE`. Mismo acceso que
        `listMosaicFeed`.
      operationId: likeMosaicItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del like
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicLikeState'
              example:
                itemId: mos_01H8X2K4QK
                likesCount: 4
                isLiked: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe, fue retirado o el usuario no tiene acceso al mosaico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Mosaic]
      summary: Remove a like from a mosaic item
      description: >
        Quita el like. Idempotente: sin like previo responde igual `200`.
        Los clientes conectados reciben `LIKE_UPDATE`.
      operationId: unlikeMosaicItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del like
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicLikeState'
              example:
                itemId: mos_01H8X2K4QK
                likesCount: 3
                isLiked: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe, fue retirado o el usuario no tiene acceso al mosaico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Recommendation Endpoints
  /api/v1/recommendations/events:
    post:
      tags: [Recommendations]
      summary: Get event recommendations
      description: Devuelve eventos recomendados para el usuario, ordenados por score.
      operationId: getEventRecommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                limit:
                  type: integer
                  default: 10
      responses:
        '200':
          description: Event recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event_id:
                      type: string
                    event_name:
                      type: string
                    score:
                      type: number
                    reason:
                      type: string
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Moderation Endpoints
  /api/v1/moderation/check:
    post:
      tags: [Moderation]
      summary: Check content for moderation
      description: >
        Evalúa contenido contra el servicio de moderación y devuelve la
        acción recomendada.
      operationId: checkContentModeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_id, content_type, user_id]
              properties:
                content_id:
                  type: string
                content_type:
                  type: string
                  enum: [text, image, video]
                content_text:
                  type: string
                content_url:
                  type: string
                user_id:
                  type: string
      responses:
        '200':
          description: Moderation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  content_id:
                    type: string
                  is_safe:
                    type: boolean
                  confidence:
                    type: number
                  flags:
                    type: array
                    items:
                      type: string
                  recommended_action:
                    type: string
                    enum: [approve, flag_for_review, reject]
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Authentication
    description: User registration and login
  - name: Events
    description: Event lifecycle management (ADR-001)
  - name: Chat
    description: Real-time messaging
  - name: Media
    description: File upload and management
  - name: Mosaic
    description: Live event mosaic (Ola 3, ADR-016)
  - name: Recommendations
    description: AI-powered recommendations
  - name: Moderation
    description: Content moderation
