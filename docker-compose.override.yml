version: '3.8'

# Development overrides
# This file is automatically loaded by docker-compose

services:
  # MinIO for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: vito-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?definir en .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?definir en .env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vito-network

  # MongoDB Express for database management
  mongo-express:
    image: mongo-express:latest
    container_name: vito-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:?definir en .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:?definir en .env}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:?definir en .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?definir en .env}
    depends_on:
      - mongodb
    networks:
      - vito-network

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: vito-redis-commander
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - vito-network

  # Kafka UI for Kafka management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vito-kafka-ui
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - vito-network

volumes:
  minio_data:

networks:
  vito-network:
    driver: bridge
