name: ViTo CD

# Despliegue continuo del backend al VPS (feature 001, ADR-011). Sin registro: las imágenes
# viajan como artifacts y se cargan por SSH. Contrato:
# specs/001-cd-produccion/contracts/workflows.md · Operación: docs/runbooks/despliegue.md
#
#   changes ─► build (por servicio, sin secretos) ─► deploy (Environment, aprobación) ─► tag

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy: despliega main · preflight: verifica SSH, secretos y configuración sin tocar nada'
        type: choice
        options: [ deploy, preflight ]
        default: deploy
      force_live_event:
        description: 'Desplegar aunque haya un evento en vivo (solo hotfix; exige reason)'
        type: boolean
        default: false
      reason:
        description: 'Motivo (obligatorio con force_live_event)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Qué cambió desde el último despliegue exitoso y a qué Environment va (R1, R2, R5)
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      services: ${{ steps.svc.outputs.services }}
      matrix: ${{ steps.svc.outputs.matrix }}
      bundle_changed: ${{ steps.svc.outputs.bundle_changed }}
      kind: ${{ steps.env.outputs.kind }}
      environment: ${{ steps.env.outputs.environment }}
      version: ${{ steps.version.outputs.version }}
      proceed: ${{ steps.decide.outputs.proceed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deployments API: cada job con `environment:` registra uno, con su SHA y su estado
      - name: Último despliegue exitoso
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(
            for env in production production-hotfix; do
              gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$env&per_page=30" \
                --jq '.[] | "\(.created_at) \(.sha) \(.statuses_url)"'
            done | sort -r | while read -r _ dsha url; do
              if [ "$(gh api "$url?per_page=1" --jq '.[0].state // ""')" = success ]; then
                echo "$dsha"
                break
              fi
            done
          ) || true
          echo "Último despliegue exitoso: ${sha:-ninguno (se construye todo)}"
          echo "sha=${sha:--}" >> "$GITHUB_OUTPUT"

      - name: Servicios cambiados
        id: svc
        env:
          PREV: ${{ steps.prev.outputs.sha }}
        run: |
          out=$(infrastructure/deploy/changed-services.sh "$PREV" "$GITHUB_SHA")
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"
          services=$(sed -n 's/^services=//p' <<<"$out")
          echo "matrix=$(jq -cn --arg s "$services" '$s | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

      - name: Environment
        id: env
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'deploy' }}
        run: infrastructure/deploy/pick-environment.sh "$GITHUB_SHA" "$MODE" | tee -a "$GITHUB_OUTPUT"

      - name: VERSION
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"

      # Antes de pedir aprobación: forzar solo en hotfix y con motivo (FR-028)
      - name: ¿Hay algo que desplegar?
        id: decide
        env:
          MODE: ${{ inputs.mode || 'deploy' }}
          FORCE: ${{ inputs.force_live_event || false }}
          REASON: ${{ inputs.reason }}
          SERVICES: ${{ steps.svc.outputs.services }}
          BUNDLE: ${{ steps.svc.outputs.bundle_changed }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          if [ "$FORCE" = true ]; then
            if [ "$ENVIRONMENT" != production-hotfix ]; then
              echo "::error::force_live_event solo se acepta en un hotfix (Environment production-hotfix). Para un release, esperar a que termine el evento."
              exit 1
            fi
            if [ -z "${REASON// }" ]; then
              echo "::error::force_live_event exige reason"
              exit 1
            fi
          fi
          if [ "$MODE" = preflight ] || [ -n "$SERVICES" ] || [ "$BUNDLE" = true ]; then
            proceed=true
          else
            proceed=false
            echo "Nada que desplegar: desde el último despliegue solo cambiaron documentación, frontend o CI." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  # Una imagen por servicio cambiado: SHA + v<VERSION>, Trivy y artifact (R1, R3, R17)
  build:
    name: Build (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.proceed == 'true' && needs.changes.outputs.matrix != '[]' && (inputs.mode || 'deploy') == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Contexto de ${{ matrix.service }}
        id: ctx
        env:
          SVC: ${{ matrix.service }}
        run: |
          case "$SVC" in
            transcode-service|moderation-service) ctx="ai-services/$SVC"; file="$ctx/Dockerfile" ;;
            mongo-backup) ctx=infrastructure/backup; file="$ctx/Dockerfile" ;;
            *) ctx="backend/$SVC"; file=backend/Dockerfile ;;
          esac
          echo "context=$ctx" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mismos scopes de caché que el job docker-build de ci.yml
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          push: false
          tags: |
            vito/${{ matrix.service }}:${{ github.sha }}
            vito/${{ matrix.service }}:v${{ needs.changes.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.changes.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      # Bloquea el despliegue ante CRITICAL/HIGH con arreglo disponible y sin excepción
      # documentada en .trivyignore (Principio III)
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Comprimir
        run: zstd -T0 -19 -q "$RUNNER_TEMP/image.tar" -o "$RUNNER_TEMP/image-${{ matrix.service }}.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image-${{ matrix.service }}.tar.zst
          retention-days: 1
          compression-level: 0

  # Aprobación del Environment, live-check e instalación en el VPS (R4–R8, FR-028)
  deploy:
    name: Deploy (${{ needs.changes.outputs.environment }})
    needs: [ changes, build ]
    if: >-
      always() && needs.changes.result == 'success' && needs.changes.outputs.proceed == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.changes.outputs.environment }}
    concurrency:
      group: ${{ needs.changes.outputs.environment == 'production-preflight' && 'vps-preflight' || 'vps-production' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ github.sha }}
      MODE: ${{ inputs.mode || 'deploy' }}
      ENVIRONMENT: ${{ needs.changes.outputs.environment }}
      KIND: ${{ needs.changes.outputs.kind }}
      SERVICES: ${{ needs.changes.outputs.services }}
      FORCE: ${{ inputs.force_live_event || false }}
      REASON: ${{ inputs.reason }}
      REMOTE: /opt/vito/releases/${{ github.sha }}/infrastructure/deploy/remote
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      # Falla nombrando solo lo que falta (quickstart, paso 0)
      - name: Secretos requeridos
        env:
          S_SSH_HOST: ${{ secrets.SSH_HOST }}
          S_SSH_USER: ${{ secrets.SSH_USER }}
          S_SSH_KEY: ${{ secrets.SSH_KEY }}
          S_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          S_DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}
          S_MONGO_DEPLOY_RO_PASSWORD: ${{ secrets.MONGO_DEPLOY_RO_PASSWORD }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=()
          for n in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DOTENV_PRODUCTION MONGO_DEPLOY_RO_PASSWORD \
                   TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            v="S_$n"
            [ -n "${!v}" ] || missing+=("$n")
          done
          if ((${#missing[@]})); then
            echo "::error::Faltan secretos en el Environment $ENVIRONMENT: ${missing[*]}"
            exit 1
          fi
          echo "Secretos requeridos: presentes"

      # Quién aprobó; en hotfix, una autoaprobación exige comentario (R5, FR-002)
      - name: Aprobación
        id: approval
        if: env.ENVIRONMENT != 'production-preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          rec=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq "[.[] | select(any(.environments[]; .name == \"$ENVIRONMENT\"))] | last // {}")
          approver=$(jq -r '.user.login // ""' <<<"$rec")
          comment=$(jq -r '.comment // ""' <<<"$rec")
          if [ -z "$approver" ]; then
            echo "::error::El Environment $ENVIRONMENT no pidió aprobación: revisar sus revisores obligatorios (docs/runbooks/aprovisionamiento.md, paso 3)"
            exit 1
          fi
          if [ "$ENVIRONMENT" = production-hotfix ] && [ "$approver" = "$ACTOR" ] && [ -z "${comment// }" ]; then
            echo "::error::Autoaprobación sin motivo: en un hotfix, quien lo dispara solo puede aprobarlo escribiendo el motivo en el comentario de la aprobación"
            exit 1
          fi
          echo "Aprobó: $approver"
          echo "approver=$approver" >> "$GITHUB_OUTPUT"
          jq -rn --arg c "$comment" '"comment=" + ($c | @json)' >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      # El Environment es la fuente del .env (R15). La verificación previa usa una copia y
      # no pisa el que usan los servicios.
      - name: .env de producción
        env:
          DOTENV: ${{ secrets.DOTENV_PRODUCTION }}
        run: |
          target=/opt/vito/.env
          [ "$MODE" = preflight ] && target=/opt/vito/.env.preflight
          printf '%s\n' "$DOTENV" | ssh vps "umask 077 && cat > $target.tmp && mv -f $target.tmp $target"

      # Bundle (R4): compose, VERSION, configuración montada y scripts remotos
      - name: Subir el bundle
        run: |
          b="$RUNNER_TEMP/bundle"
          mkdir -p "$b"
          cp --parents docker-compose.prod.yml VERSION "$b"
          for d in infrastructure/caddy infrastructure/docker/srs infrastructure/deploy/remote infrastructure/observability; do
            [ -d "$d" ] && cp -r --parents "$d" "$b"
          done
          tar -C "$b" -czf - . | ssh vps "mkdir -p /opt/vito/releases/$SHA && tar -xzf - -C /opt/vito/releases/$SHA"

      - name: Verificación previa
        if: env.MODE == 'preflight'
        run: |
          rc=0
          ssh vps "DEPLOY_ENV_FILE=/opt/vito/.env.preflight $REMOTE/deploy.sh check $SHA" || rc=$?
          ssh vps 'rm -f /opt/vito/.env.preflight'
          if [ "$rc" -eq 0 ]; then
            echo "## ✅ Verificación previa OK: SSH con huella fija, secretos y \`config -q\` con el .env real" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Verificación previa falló (código $rc)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # ¿Evento en vivo? 3 = bloqueado, 7 = no se pudo comprobar (R6, FR-028)
      - name: Evento en vivo
        id: live
        if: env.MODE == 'deploy'
        env:
          RO_PW: ${{ secrets.MONGO_DEPLOY_RO_PASSWORD }}
        run: |
          rc=0
          out=$(printf '%s\n' "$RO_PW" | ssh vps \
            "read -r MONGO_DEPLOY_RO_PASSWORD && export MONGO_DEPLOY_RO_PASSWORD && $REMOTE/ensure-ro-user.sh && $REMOTE/live-check.sh") || rc=$?
          json=$(tail -n1 <<<"$out")
          echo "$json"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          jq -e . >/dev/null 2>&1 <<<"$json" && echo "json=$json" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            3|7)
              if [ "$FORCE" = true ]; then
                echo "::warning::Evento en vivo (código $rc): se despliega igual por force_live_event. Motivo: $REASON"
                echo "forced=true" >> "$GITHUB_OUTPUT"
              else
                [ "$rc" = 3 ] && echo "::error::Hay un evento o un stream en vivo: no se despliega. Esperar a que termine o, si es un hotfix urgente, relanzar con force_live_event y reason."
                [ "$rc" = 7 ] && echo "::error::No se pudo comprobar si hay un evento en vivo: no se despliega."
                exit "$rc"
              fi
              ;;
            *) echo "::error::live-check o ensure-ro-user fallaron (código $rc)"; exit "$rc" ;;
          esac

      - uses: actions/download-artifact@v4
        if: env.MODE == 'deploy' && env.SERVICES != ''
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      # Se envía comprimido y se descomprime en el VPS (bootstrap.sh instala zstd)
      - name: Cargar imágenes
        if: env.MODE == 'deploy' && env.SERVICES != ''
        run: |
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do
            echo "::group::$(basename "$f")"
            ssh vps 'zstd -dc | docker load' < "$f"
            echo "::endgroup::"
          done

      - name: Aplicar
        id: apply
        if: env.MODE == 'deploy'
        env:
          APPROVER: ${{ steps.approval.outputs.approver }}
          APPROVAL_COMMENT: ${{ steps.approval.outputs.comment }}
          TRIGGERED_BY: ${{ github.triggering_actor }}
          LIVE: ${{ steps.live.outputs.json }}
          FORCED: ${{ steps.live.outputs.forced }}
        run: |
          # El paso Aprobación lo guardó como string JSON (puede tener saltos de línea)
          comment=$(jq -r . <<<"${APPROVAL_COMMENT:-\"\"}")
          meta=$(jq -cn --arg approver "$APPROVER" --arg by "$TRIGGERED_BY" --arg reason "${REASON:-$comment}" \
            --arg run "$RUN_URL" --arg kind "$KIND" --arg forced "${FORCED:-false}" --arg live "${LIVE:-null}" \
            '{approver: $approver, triggered_by: $by, reason: (if $reason == "" then null else $reason end),
              run_url: $run, kind: $kind, forced_live_event: ($forced == "true"),
              live_check: ($live | fromjson? // null)}')
          rc=0
          out=$(ssh vps "$(printf '%q ' "$REMOTE/deploy.sh" apply "$SHA" --changed "$SERVICES" --meta "$meta")") || rc=$?
          record=$(tail -n1 <<<"$out")
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if jq -e . >/dev/null 2>&1 <<<"$record"; then
            echo "record=$record" >> "$GITHUB_OUTPUT"
            infrastructure/deploy/summary.sh <<<"$record" >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$rc" in
            0) echo "Desplegado: $SHA" ;;
            2) echo "::error::Configuración inválida o secreto faltante (código 2): no se tocó nada" ;;
            4) echo "::error::Falta una imagen o el bundle (código 4): no se tocó nada" ;;
            5) echo "::error::La salud falló y se volvió al release anterior (código 5)" ;;
            6) echo "::error::La salud falló y no se pudo volver (código 6): requiere un lead (docs/runbooks/despliegue.md)" ;;
            *) echo "::error::deploy.sh salió con $rc" ;;
          esac
          exit "$rc"

      - name: Avisar
        if: failure() || steps.live.outputs.forced == 'true'
        uses: ./.github/actions/notify
        with:
          subject: "ViTo · despliegue ${{ job.status == 'success' && 'forzado en evento en vivo' || 'falló' }} (${{ needs.changes.outputs.environment }})"
          message: |
            Release: ${{ github.sha }} (v${{ needs.changes.outputs.version }}, ${{ needs.changes.outputs.kind }})
            Servicios: ${{ needs.changes.outputs.services || 'ninguno (solo bundle)' }}
            Evento en vivo: código ${{ steps.live.outputs.rc || '—' }} · deploy.sh: código ${{ steps.apply.outputs.exit_code || '—' }}
            Disparó: ${{ github.triggering_actor }}
            ${{ env.RUN_URL }}
          telegram-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          alert-emails: ${{ secrets.ALERT_EMAILS }}
          alert-from: ${{ vars.ALERT_FROM }}

      - name: Borrar la llave
        if: always()
        run: rm -f ~/.ssh/vito_key ~/.ssh/vito_known_hosts ~/.ssh/config

  # Tag git v<VERSION> tras un despliegue exitoso (R1). Job aparte: es el único con
  # permiso de escritura y no tiene secretos.
  tag:
    name: Tag v${{ needs.changes.outputs.version }}
    needs: [ changes, deploy ]
    if: needs.deploy.result == 'success' && (inputs.mode || 'deploy') == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Crear el tag si no existe
        env:
          TAG: v${{ needs.changes.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG ya existe"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Creado $TAG en $GITHUB_SHA"
          fi
