name: Deploy Frontend (Cloudflare Pages)

# Publica la web en Cloudflare Pages (T-I11; feature 001, T032 y research R9). Se compila
# aquí, con las mismas puertas que CI, y se sube con Direct Upload (wrangler): la integración
# Git de Pages se saltaría CI y la aprobación del Environment.
# Contrato: specs/001-cd-produccion/contracts/workflows.md
#
#   checks (analyze, test) ─┐
#   environment ────────────┴─► deploy (Environment, aprobación, build, wrangler)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/vito_app/**'
      - 'infrastructure/deploy/render-web-headers.sh'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Mismo pin que el job flutter-app de ci.yml (pubspec.lock lo exige)
  FLUTTER_VERSION: '3.47.x'
  # wrangler fijado: un `npx wrangler` sin versión ejecuta en el deploy lo último que se
  # publique en npm. Actualizar a propósito, no por accidente.
  WRANGLER_VERSION: '4.149.0'

jobs:
  # Puertas de calidad antes de pedir aprobación: los leads solo aprueban builds sanos
  checks:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vito_app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  # production o production-hotfix, con la misma detección que cd.yml (FR-021)
  environment:
    name: Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Environment
        id: env
        env:
          GH_TOKEN: ${{ github.token }}
        run: infrastructure/deploy/pick-environment.sh "$GITHUB_SHA" deploy | tee -a "$GITHUB_OUTPUT"

  deploy:
    name: Build & Deploy Flutter Web
    needs: [ checks, environment ]
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.environment }}
    # Un deploy a la vez; no cancelar el que está en vuelo
    concurrency:
      group: pages-production
      cancel-in-progress: false
    env:
      API_BASE_URL: ${{ vars.VITO_API_BASE_URL }}
      WS_BASE_URL: ${{ vars.VITO_WS_BASE_URL }}
      MEDIA_ORIGIN: ${{ vars.VITO_MEDIA_ORIGIN }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      SUPPORT_EMAIL: ${{ vars.VITO_SUPPORT_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      # En release Env no cae a localhost (T-F06): el build debe traer las URLs reales, y la
      # CSP necesita los tres orígenes (FR-019). Falla antes de construir: la versión
      # publicada sigue en línea.
      - name: Validate production variables
        run: |
          missing=()
          for v in API_BASE_URL WS_BASE_URL MEDIA_ORIGIN PAGES_PROJECT; do
            [ -n "${!v// /}" ] || missing+=("$v")
          done
          if ((${#missing[@]})); then
            echo "::error::Faltan variables del Environment (VITO_ o PAGES_): ${missing[*]}"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: frontend/vito_app
        run: flutter pub get

      # --no-web-resources-cdn: CanvasKit se sirve desde el propio sitio (CSP 'self')
      - name: Build web
        working-directory: frontend/vito_app
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=ENVIRONMENT=production \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WS_BASE_URL="$WS_BASE_URL" \n            --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL"

      - name: Complete CSP origins
        env:
          VITO_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITO_WS_BASE_URL: ${{ env.WS_BASE_URL }}
          VITO_MEDIA_ORIGIN: ${{ env.MEDIA_ORIGIN }}
        run: infrastructure/deploy/render-web-headers.sh frontend/vito_app/build/web/_headers

      # --branch=main: rama de producción del proyecto de Pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy frontend/vito_app/build/web \
            --project-name="$PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"

      - name: Avisar
        if: failure()
        uses: ./.github/actions/notify
        with:
          subject: "ViTo · despliegue de la web falló (${{ needs.environment.outputs.environment }})"
          message: |
            Release: ${{ github.sha }}
            Disparó: ${{ github.triggering_actor }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          telegram-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          alert-emails: ${{ secrets.ALERT_EMAILS }}
          alert-from: ${{ vars.ALERT_FROM }}
