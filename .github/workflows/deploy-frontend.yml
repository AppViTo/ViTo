name: Deploy Frontend (Vercel)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/vito_app/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Un deploy a la vez; no cancelar el que está en vuelo
concurrency:
  group: vercel-deploy-production
  cancel-in-progress: false

env:
  # Mismo pin que el job flutter-app de ci.yml (pubspec.lock lo exige)
  FLUTTER_VERSION: '3.47.x'
  # CLI de Vercel fijada: un `npm install -g vercel` sin versión ejecuta en el deploy
  # lo último que se publique en npm. Actualizar a propósito, no por accidente.
  VERCEL_CLI_VERSION: '60.1.3'

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: frontend/vito_app
        run: flutter pub get

      # Puerta de calidad: este workflow corre en paralelo a ci.yml, así que sin
      # estos pasos se publicaría a producción aunque el análisis o los tests fallen.
      - name: Analyze
        working-directory: frontend/vito_app
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: frontend/vito_app
        run: flutter test

      # En release Env no cae a localhost (T-F06): el build debe traer las URLs reales.
      - name: Validate production URLs
        working-directory: frontend/vito_app
        env:
          API_BASE_URL: ${{ vars.VITO_API_BASE_URL }}
          WS_BASE_URL: ${{ vars.VITO_WS_BASE_URL }}
        run: |
          if [ -z "${API_BASE_URL// /}" ] || [ -z "${WS_BASE_URL// /}" ]; then
            echo "::error::Faltan VITO_API_BASE_URL y/o VITO_WS_BASE_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Build web
        working-directory: frontend/vito_app
        env:
          API_BASE_URL: ${{ vars.VITO_API_BASE_URL }}
          WS_BASE_URL: ${{ vars.VITO_WS_BASE_URL }}
        run: |
          flutter build web --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WS_BASE_URL="$WS_BASE_URL"

      # Vercel lee vercel.json desde el directorio desplegado: copiarlo a build/web
      - name: Copy vercel.json into build output
        run: cp frontend/vito_app/vercel.json frontend/vito_app/build/web/vercel.json

      - name: Install Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION}"

      # Despliega build/web como sitio estático en el proyecto vito-app (producción).
      # Se corre desde dentro de build/web (misma forma que el deploy manual validado).
      - name: Deploy to Vercel
        working-directory: frontend/vito_app/build/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
