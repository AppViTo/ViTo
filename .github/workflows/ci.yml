name: ViTo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.11'
  # pubspec.lock fija intl 0.20.3; Flutter 3.44 trae 0.20.2 y pub get falla
  FLUTTER_VERSION: '3.47.x'

jobs:
  # Contrato (T-C03): Spectral sobre openapi.yaml + fixtures validados contra su schema.
  # Corre en todos los PR (es barato) para poder marcarlo como check requerido.
  contract:
    name: Contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install contract tooling
        run: npm ci

      - name: Lint openapi.yaml (Spectral)
        run: npm run lint:api

      - name: Validate fixtures against openapi.yaml
        run: npm run validate:fixtures

      # Se activa sola cuando T-C05 cree el archivo
      - name: Validate asyncapi.yaml
        if: hashFiles('docs/api/asyncapi.yaml') != ''
        run: npm run lint:async

  # Servicios Spring Boot: compilación limpia + tests de cada uno
  backend:
    name: Backend Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - social-service
          - event-service
          - checkin-service
          - mosaic-service
          - streaming-service
          - archive-service
          - chat-service
          - media-service

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: test_password

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify
        env:
          # Solo para los tests de contexto sin src/test/resources propio
          MONGODB_URI: mongodb://admin:test_password@localhost:27017/test_db?authSource=admin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-surefire-reports
          path: backend/${{ matrix.service }}/target/surefire-reports/

  # Transcode Service (FastAPI)
  transcode-service:
    name: Transcode Service Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ai-services/transcode-service
    
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          pytest --cov=app --cov-report=xml --cov-report=html
        env:
          REDIS_URL: redis://localhost:6379
          MONGODB_URI: mongodb://localhost:27017/test_db
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcode-service-coverage
          path: ai-services/transcode-service/htmlcov/

  # Moderation Service (FastAPI) — ADR-011 lo despliega, así que entra a CI (T-B14)
  moderation-service:
    name: Moderation Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/moderation-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=xml
        env:
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: test-secret-key-for-unit-tests-only-256-bits-long

  # Flutter App
  flutter-app:
    name: Flutter App Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend/vito_app
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze --fatal-infos
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/vito_app/coverage/lcov.info

  # Docker Build: imágenes de los 10 servicios Java (Dockerfile común) y de transcode
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, transcode-service]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api-gateway,       context: backend/api-gateway,       dockerfile: backend/Dockerfile }
          - { service: auth-service,      context: backend/auth-service,      dockerfile: backend/Dockerfile }
          - { service: social-service,    context: backend/social-service,    dockerfile: backend/Dockerfile }
          - { service: event-service,     context: backend/event-service,     dockerfile: backend/Dockerfile }
          - { service: checkin-service,   context: backend/checkin-service,   dockerfile: backend/Dockerfile }
          - { service: mosaic-service,    context: backend/mosaic-service,    dockerfile: backend/Dockerfile }
          - { service: streaming-service, context: backend/streaming-service, dockerfile: backend/Dockerfile }
          - { service: archive-service,   context: backend/archive-service,   dockerfile: backend/Dockerfile }
          - { service: chat-service,      context: backend/chat-service,      dockerfile: backend/Dockerfile }
          - { service: media-service,     context: backend/media-service,     dockerfile: backend/Dockerfile }
          - { service: transcode-service, context: ai-services/transcode-service, dockerfile: ai-services/transcode-service/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: vito/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
