name: ViTo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.2.0'

jobs:
  # Auth Service (Spring Boot)
  auth-service:
    name: Auth Service Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend/auth-service
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: test_password
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean compile -DskipTests
      
      - name: Run tests
        run: mvn test
        env:
          SPRING_DATA_MONGODB_URI: mongodb://admin:test_password@localhost:27017/test_db?authSource=admin
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-coverage
          path: backend/auth-service/target/site/jacoco/

  # Transcode Service (FastAPI)
  transcode-service:
    name: Transcode Service Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ai-services/transcode-service
    
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          pytest --cov=app --cov-report=xml --cov-report=html
        env:
          REDIS_URL: redis://localhost:6379
          MONGODB_URI: mongodb://localhost:27017/test_db
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcode-service-coverage
          path: ai-services/transcode-service/htmlcov/

  # Flutter App
  flutter-app:
    name: Flutter App Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend/vito_app
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze --fatal-infos
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/vito_app/coverage/lcov.info

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [auth-service, transcode-service]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Auth Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/auth-service
          push: false
          tags: vito/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Transcode Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ai-services/transcode-service
          push: false
          tags: vito/transcode-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
